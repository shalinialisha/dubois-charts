name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]                 # a version tag: everything, macOS and Windows too
  pull_request:
  workflow_dispatch:             # "Run workflow" on GitHub: everything, now

jobs:
  linux:
    name: Python ${{ matrix.python }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q

  # macOS and Windows -- their fonts, their default file encodings -- on
  # the oldest and newest Python, for a version tag or when asked for.
  # Not on every push: in a private repository a macOS minute costs about
  # ten Linux minutes of the monthly allowance, a Windows minute nearly
  # two. (Public repositories run free; then these can run on every push.)
  mac-and-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q

  oldest-dependencies:
    name: Oldest supported numpy, matplotlib and scipy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the oldest versions pyproject.toml allows
        run: |
          python -m pip install "numpy==1.21.6" "matplotlib==3.6.3" "scipy==1.7.3" "pandas==1.3.5"
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q

  images:
    name: Image comparison
    runs-on: ubuntu-latest
    env:
      DUBOIS_CHARTS_REQUIRE_IMAGE_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the versions the reference images were drawn with
        run: |
          versions=$(python -c "import json; e = json.load(open('tests/baseline/environment.json')); print(' '.join(k + '==' + e[k] for k in ('matplotlib', 'numpy', 'scipy')))")
          python -m pip install pytest $versions
          python -m pip install -e . --no-deps
      - name: Compare every chart with its reference image
        run: python -m pytest tests/test_images.py -v --basetemp=image-results
      - name: Keep the images that differ
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: image-differences
          path: image-results/

  package:
    name: Build the package and install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and draw every chart
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import dubois_charts
          dubois_charts.bar_chart(["A", "B"], [1, 2])
          dubois_charts.county_map_chart({"Fulton": 1.0, "DeKalb": 2.0}, state="GA")
          dubois_charts.county_map_chart({"17031": 5.1, "48201": 4.3})
          dubois_charts.state_map_chart({"CA": 39.5, "TX": 29.1})
          from dubois_charts.charts import plate51
          plate51.create_side_by_side()
          print("installed", dubois_charts.__version__)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
