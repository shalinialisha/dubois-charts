name: Release

# Publishing a GitHub release builds the package and -- if the repository
# is public -- uploads it to PyPI. PyPI trusts this workflow directly
# ("trusted publishing"), so no password or token is stored anywhere; it
# has to be set up once on pypi.org first -- see RELEASING.md.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The release is of the version the package says it is
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('dubois_charts/__init__.py').read()).group(1))")
          echo "package version $version, release $TAG"
          test "v$version" = "$TAG"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    # Not from a private repository: see RELEASING.md.
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dubois-charts
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
