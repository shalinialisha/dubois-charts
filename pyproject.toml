[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dubois-charts"
dynamic = ["version"]                   # dubois_charts.__version__, the one place it's written
description = "Charts in the style of W.E.B. Du Bois's 1900 data portraits, for your own data: bar, area, butterfly, spiral, snake and pie charts, and county and state maps"
readme = "README.md"
requires-python = ">=3.10"
# The code is MIT; the county boundaries bundled with it are us-atlas's,
# under the ISC licence.
license = "MIT AND ISC"
license-files = ["LICENSE", "dubois_charts/charts/data/us-atlas-LICENSE.txt",
                 "dubois_charts/charts/data/plotly-datasets-LICENSE.txt"]
authors = [
    {name = "shalinialisha"}
]
keywords = ["visualization", "data-viz", "du-bois", "dubois", "matplotlib", "charts",
            "choropleth", "infographics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

# The oldest versions here are the oldest the whole test suite has passed
# with (on Python 3.10). matplotlib 3.5 can't be used: it has no
# `text.parse_math` setting, which keeps "$" signs in labels from being
# read as maths.
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.21",
    # Used by the hand-painted texture (on by default in most charts) and
    # by plate51.py. Imported lazily inside those functions, which is why
    # a missing scipy never broke importing the package itself -- only the
    # first chart call -- and why it went unnoticed until a clean-install test.
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "pandas>=1.3",                          # the tests of Series and DataFrame input
    "tomli>=1.1; python_version < '3.11'",  # the packaging tests read pyproject.toml
]
tutorial = [
    "notebook",                             # docs/tutorial.ipynb
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/shalinialisha/dubois-charts"
Tutorial = "https://github.com/shalinialisha/dubois-charts/blob/main/docs/tutorial.ipynb"
Changelog = "https://github.com/shalinialisha/dubois-charts/blob/main/CHANGELOG.md"
Issues = "https://github.com/shalinialisha/dubois-charts/issues"

[tool.setuptools.dynamic]
version = {attr = "dubois_charts.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["dubois_charts*"]

# Non-Python files the code opens at runtime. Without this, setuptools
# builds a package containing only .py files: county_map_chart() then
# fails with FileNotFoundError on the bundled Georgia boundaries, and
# plate51.create_side_by_side() can't find its reference scan. Found by
# installing into a fresh virtual environment, not from the source tree.
[tool.setuptools.package-data]
"dubois_charts.charts" = [
    "data/*.geojson",
    "data/*.json",
    "data/*.txt",
    "reference-original-plate-51.jpg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
